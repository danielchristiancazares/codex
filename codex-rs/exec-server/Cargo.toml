[package]
name = "codex-exec-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
arc-swap = { workspace = true }
axum = { workspace = true, features = ["http1", "ws"] }
base64 = { workspace = true, features = ["alloc"] }
bytes = { workspace = true }
clatter = { workspace = true, features = [
    "alloc",
    "getrandom",
    "use-25519",
    "use-aes-gcm",
    "use-rust-crypto-ml-kem",
    "use-sha",
] }
codex-api = { workspace = true }
codex-config = { workspace = true }
codex-http-client = { workspace = true }
codex-exec-server-protocol = { workspace = true }
codex-file-system = { workspace = true }
codex-network-proxy = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
codex-sandboxing = { workspace = true }
codex-shell-command = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-path-uri = { workspace = true }
codex-utils-pty = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
codex-websocket-client = { workspace = true }
dirs = { workspace = true }
futures = { workspace = true, features = ["async-await"] }
http = { workspace = true }
prost = { version = "0.14.3", default-features = false, features = ["derive", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc"] }
thiserror = { workspace = true }
toml = { workspace = true, features = ["display", "parse", "serde", "std"] }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["io", "rt"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
tracing = { workspace = true, features = ["attributes"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["fs", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { default-features = false, version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = { workspace = true, features = ["std"] }
codex-exec-server-test-support = { workspace = true }
codex-test-binary-support = { workspace = true }
ctor = { workspace = true, features = ["proc_macro"] }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
pretty_assertions = { workspace = true, features = ["std"] }
rcgen = { workspace = true, features = ["aws_lc_rs", "pem"] }
rustls = { workspace = true, features = ["std", "tls12"] }
serial_test = { workspace = true, features = ["async"] }
tempfile = { workspace = true, features = ["getrandom"] }
test-case = { version = "3.3.1", default-features = false }
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
wiremock = { workspace = true }
