[package]
edition.workspace = true
license.workspace = true
name = "codex-code-mode"
version.workspace = true

[lib]
doctest = false
name = "codex_code_mode"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
codex-code-mode-protocol = { workspace = true }
codex-http-client = { workspace = true }
codex-install-context = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
futures = { workspace = true }
http-body-util = { version = "0.1.3", default-features = false }
prost = { version = "0.14.3", default-features = false, features = ["derive", "std"] }
reqwest = { workspace = true, features = ["http2", "stream"] }
serde_json = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["channel", "codegen"] }
tower = { default-features = false, version = "0.5.3", features = ["util"] }
tracing = { workspace = true, features = ["attributes"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["test-util"] }
