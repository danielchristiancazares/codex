[package]
name = "codex-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-channel = { workspace = true }
base64 = { workspace = true, features = ["alloc"] }
bytes = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
codex-client = { workspace = true }
codex-http-client = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
codex-websocket-client = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
schemars = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc", "raw_value"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = [
    "connect",
    "proxy",
    "rustls-tls-native-roots",
] }
tungstenite = { workspace = true, features = ["deflate"] }
tracing = { workspace = true, features = ["attributes"] }
eventsource-stream = { workspace = true }
regex-lite = { workspace = true, features = ["std", "string"] }
tokio-util = { workspace = true, features = ["codec", "io"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
anyhow = { workspace = true, features = ["std"] }
assert_matches = { workspace = true }
pretty_assertions = { workspace = true, features = ["std"] }
tokio-test = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true

[lib]
doctest = false
