[package]
name = "codex-network-proxy"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "codex_network_proxy"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["alloc"] }
clap = { workspace = true, features = ["derive", "std"] }
chrono = { workspace = true, features = ["clock"] }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
globset = { workspace = true }
opentelemetry = { workspace = true, features = ["trace"] }
rand = { workspace = true, features = ["thread_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing = { workspace = true }
url = { workspace = true }
rama-core = { version = "=0.3.0-alpha.4", default-features = false }
rama-http = { version = "=0.3.0-alpha.4", default-features = false }
rama-http-backend = { version = "=0.3.0-alpha.4", default-features = false, features = ["tls"] }
rama-net = { version = "=0.3.0-alpha.4", default-features = false, features = ["http", "tls"] }
rama-socks5 = { version = "=0.3.0-alpha.4", default-features = false }
rama-tcp = { version = "=0.3.0-alpha.4", default-features = false, features = ["http"] }
rama-tls-rustls = { version = "=0.3.0-alpha.4", default-features = false, features = ["http"] }
rustls-native-certs = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["std"] }
tempfile = { workspace = true, features = ["getrandom"] }

[target.'cfg(target_family = "unix")'.dependencies]
rama-unix = { version = "=0.3.0-alpha.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
schannel = { version = "0.1", default-features = false }
windows-sys = { version = "0.52", default-features = false, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
codex-windows-sandbox = { path = "../windows-sandbox-rs", default-features = false }
