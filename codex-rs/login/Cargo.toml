[package]
name = "codex-login"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
base64 = { workspace = true, features = ["alloc"] }
chrono = { workspace = true, features = ["clock", "serde"] }
codex-agent-identity = { workspace = true }
codex-config = { workspace = true }
codex-http-client = { workspace = true }
codex-keyring-store = { workspace = true }
codex-model-provider-info = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
codex-secrets = { workspace = true }
codex-terminal-detection = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-template = { workspace = true }
codex-workload-identity = { workspace = true }
http = { workspace = true }
once_cell = { workspace = true, features = ["std"] }
os_info = { workspace = true }
rand = { workspace = true, features = ["thread_rng"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tiny_http = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = { workspace = true, features = ["attributes"] }
url = { workspace = true }
urlencoding = { workspace = true }
webbrowser = { workspace = true }

[dev-dependencies]
core_test_support = { workspace = true }
jsonwebtoken = { workspace = true, features = ["use_pem"] }
keyring = { workspace = true }
pretty_assertions = { workspace = true, features = ["std"] }
regex-lite = { workspace = true, features = ["std", "string"] }
serial_test = { workspace = true, features = ["async"] }
tempfile = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
wiremock = { workspace = true }

[lib]
doctest = false
