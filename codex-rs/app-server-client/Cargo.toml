[package]
name = "codex-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-app-server = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-arg0 = { workspace = true }
codex-config = { workspace = true }
codex-core = { workspace = true }
codex-exec-server = { workspace = true }
codex-feedback = { workspace = true }
codex-protocol = { workspace = true }
codex-uds = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-rustls-provider = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }
tokio-tungstenite = { workspace = true, features = [
    "connect",
    "proxy",
    "rustls-tls-native-roots",
] }
toml = { workspace = true, features = ["serde", "std"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["alloc"] }
tempfile = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
