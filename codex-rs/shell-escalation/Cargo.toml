[package]
edition.workspace = true
license.workspace = true
name = "codex-shell-escalation"
version.workspace = true

[[bin]]
name = "codex-execve-wrapper"
path = "src/bin/main_execve_wrapper.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true, features = ["derive", "std"] }
codex-protocol = { workspace = true }
codex-utils-absolute-path = { workspace = true }
libc = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc"] }
socket2 = { workspace = true, features = ["all"] }
tokio = { workspace = true, features = [
    "io-std",
    "net",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "tracing-log"] }

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["std"] }
tempfile = { workspace = true, features = ["getrandom"] }

[lib]
doctest = false
