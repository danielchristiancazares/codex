[package]
name = "codex-lmstudio"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_lmstudio"
path = "src/lib.rs"
doctest = false


[dependencies]
codex-core = { path = "../core", default-features = false }
codex-http-client = { workspace = true }
codex-model-provider-info = { path = "../model-provider-info", default-features = false }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
tracing = { version = "0.1.44", default-features = false, features = ["log", "std"] }
which = { version = "8.0", default-features = false, features = ["real-sys"] }

[dev-dependencies]
wiremock = { version = "0.6", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }

[lints]
workspace = true
