[package]
name = "codex-code-mode-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codex-code-mode-host"
path = "src/main.rs"

[lib]
doctest = false
name = "codex_code_mode_host"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["http1", "ws"] }
clap = { workspace = true, features = ["derive", "std"] }
codex-code-mode-protocol = { workspace = true }
codex-code-mode-runtime = { workspace = true }
codex-otel = { workspace = true }
codex-protocol = { workspace = true }
futures = { workspace = true }
prost = { version = "0.14.3", default-features = false, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["alloc"] }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["codegen", "router", "transport"] }
tracing = { workspace = true, features = ["attributes"] }
tracing-subscriber = { workspace = true, features = ["fmt", "tracing-log"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
codex-code-mode = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true, features = ["std"] }
tempfile = { workspace = true, features = ["getrandom"] }
tokio-stream = { workspace = true, features = ["net"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }

# `cargo-shear` does not discover Bazel's `e2e_benches/` targets.
[package.metadata.cargo-shear]
ignored = ["tokio-tungstenite"]
