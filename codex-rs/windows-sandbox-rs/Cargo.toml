[package]
build = "build.rs"
edition.workspace = true
license.workspace = true
name = "codex-windows-sandbox"
version.workspace = true

[lib]
name = "codex_windows_sandbox"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "codex-windows-sandbox-setup"
path = "src/bin/setup_main/main.rs"

[[bin]]
name = "codex-command-runner"
path = "src/bin/command_runner/main.rs"

[[bin]]
name = "codex-windows-managed-deny-probe"
path = "src/bin/managed_deny_probe/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { version = "1.0", default-features = false, features = ["std"] }
base64 = { workspace = true, features = ["alloc"] }
chrono = { version = "0.4.42", default-features = false, features = [
    "clock",
] }
codex-utils-pty = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-string = { workspace = true }
codex-otel = { workspace = true }
dunce = { version = "1.0", default-features = false }
glob = { workspace = true }
serde = { default-features = false, version = "1.0", features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
tempfile = { version = "3", default-features = false, features = ["getrandom"] }
tokio = { workspace = true, features = ["sync", "rt", "macros", "signal", "time"] }
tracing-appender = { workspace = true }
windows = { default-features = false, version = "0.58", features = [
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_System_Variant",
] }

[dependencies.codex-protocol]
default-features = false
package = "codex-protocol"
path = "../protocol"

[dependencies.rand]
default-features = false
features = ["std", "small_rng"]
version = "0.8"

[dependencies.dirs-next]
default-features = false
version = "2.0"

[target.'cfg(windows)'.dependencies.windows-sys]
default-features = false
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Services",
]
version = "0.52"

[dev-dependencies]
pretty_assertions = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread"] }
