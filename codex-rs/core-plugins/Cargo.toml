[package]
edition.workspace = true
license.workspace = true
name = "codex-core-plugins"
version.workspace = true

[lib]
doctest = false
name = "codex_core_plugins"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
codex-analytics = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-config = { workspace = true }
codex-connectors = { workspace = true }
codex-exec-server = { workspace = true }
codex-git-utils = { workspace = true }
codex-hooks = { workspace = true }
codex-http-client = { workspace = true }
codex-login = { workspace = true }
codex-mcp = { workspace = true }
codex-model-provider = { workspace = true }
codex-otel = { workspace = true }
codex-plugin = { workspace = true }
codex-protocol = { workspace = true }
codex-skills = { workspace = true }
codex-shell-command = { workspace = true }
codex-tools = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-path = { workspace = true }
codex-utils-path-uri = { workspace = true }
codex-utils-plugins = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
dirs = { workspace = true }
flate2 = { workspace = true, features = ["rust_backend"] }
futures = { workspace = true, features = ["async-await"] }
http = { workspace = true }
regex = { workspace = true, features = ["perf", "std", "unicode"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["alloc"] }
serde_with = { workspace = true, features = ["std"] }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true, features = ["getrandom"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt", "sync", "time"] }
toml = { workspace = true, features = ["display", "parse", "serde", "std"] }
tracing = { workspace = true, features = ["attributes"] }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
zip = { workspace = true, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
which = { workspace = true, features = ["real-sys"] }

[dev-dependencies]
codex-exec-server-test-support = { workspace = true }
libc = { workspace = true }
pretty_assertions = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }
tracing-test = { workspace = true, features = ["no-env-filter"] }
wiremock = { workspace = true }
